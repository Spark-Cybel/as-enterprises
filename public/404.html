<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AS Enterprises</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // This script redirects 404 requests to the main index.html
      // while preserving the original path in the URL
      // pathSegmentsToKeep = 1 for /as-enterprises/ subdirectory deployment
      const pathSegmentsToKeep = 1;

      const l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
